name: secretome
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # signalp6 has its own pinned dependency stack (torch etc.) that can
  # conflict with the annotation env's Python 3.11 pin -- kept isolated.
  - signalp6
  # fallback if the SignalP 6.0 academic-license weights are not yet
  # installed (services.healthtech.dtu.dk) -- secretome_predict.py auto-detects
  # whichever binary is present via shutil.which().
  # - signalp=5.0b   # uncomment if using SignalP 5.0 instead of 6.0

  - tmhmm

  # Python e bibliotecas para secretome_predict.py
  - python=3.11
  - pandas
  - matplotlib
  - biopython
