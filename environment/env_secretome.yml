name: secretome
channels:
  - conda-forge
dependencies:
  # SignalP6/TMHMM require a DTU academic license (manual download,
  # never completed in this or two other lab projects -- see README
  # Known Issues). Replaced by TMbed (Bernhofer & Rost 2022, BMC
  # Bioinformatics), a fully local/open pLM-based predictor that
  # classifies signal peptide + transmembrane helix/strand in one model,
  # no login or license required: https://github.com/BernhoferM/TMbed
  - python=3.11
  - pandas
  - matplotlib
  - biopython
  - pip
  - pip:
      - torch>=1.10.2
      # TMbed's embed.py calls tokenizer.batch_encode_plus(), removed in
      # transformers v5's tokenization overhaul (still present, just
      # deprecated, throughout the v4 line) -- pin <5 until TMbed updates.
      - transformers<5
      - sentencepiece
      - tiktoken
      - protobuf
      - h5py
      - git+https://github.com/BernhoferM/TMbed.git
